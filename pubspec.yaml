name: apnasolar
description: "ApnaSolar — AI-powered rooftop solar advisor for Indian homeowners."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1

  # Firebase core & services
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.6

  # Image picker for rooftop photo capture
  image_picker: ^1.1.2

  # Local persistence for session state between restarts
  shared_preferences: ^2.5.3

  # UUID generation for Firestore document IDs
  uuid: ^4.5.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
